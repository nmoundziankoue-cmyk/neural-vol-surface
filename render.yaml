databases:
  - name: neural-vol-surface-db
    databaseName: vol_surface
    user: vol_user
    plan: free

services:
  - type: web
    name: neural-vol-surface-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: neural-vol-surface-db
          property: connectionString
      # Placeholder until the Next.js frontend is deployed - update then
      # (see README). CORS will reject the real frontend's origin until this
      # is set correctly.
      - key: FRONTEND_ORIGIN
        value: http://localhost:3000
