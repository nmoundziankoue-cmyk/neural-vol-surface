services:
  - type: web
    name: neural-vol-surface-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      # External Postgres (Neon free tier) - NOT a Render-managed database.
      # Set this manually in the Render dashboard (web service -> Environment)
      # right after the first deploy, using Neon's connection string, e.g.
      #   postgresql://user:pass@ep-xxx-pooler.<region>.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      # config.py::_normalize_database_url rewrites the scheme to
      # postgresql+psycopg2:// and preserves the ?sslmode=require query that
      # psycopg2 needs for Neon.
      - key: DATABASE_URL
        sync: false
      # Set to the deployed frontend origin (the Vercel Production URL) once
      # the frontend is live, else CORS rejects the browser. Harmless default
      # until then.
      - key: FRONTEND_ORIGIN
        value: http://localhost:3000
