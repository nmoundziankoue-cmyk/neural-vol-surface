name: Daily SPY Vol Surface Capture

# Replaces the local macOS cron job, which failed silently for over a
# month: it only fires when the Mac happens to be awake at trigger time
# (no catch-up), and every one of the handful of times it did fire, the
# local Postgres container wasn't running. GitHub Actions runs on
# GitHub's infrastructure, not this laptop.

on:
  schedule:
    # GitHub Actions cron is UTC-only and does not observe DST (unlike
    # Unix cron's TZ= prefix, which is what the old local crontab used).
    # Two triggers instead of one so the capture reliably lands at 17:00
    # ET year-round: 21:00 UTC = 17:00 EDT (Mar-Nov), 22:00 UTC = 17:00
    # EST (Nov-Mar). The "wrong" one of the two fires an hour off
    # (16:00 or 18:00 ET) - still safely after the 16:00 ET market close,
    # and daily_capture.py's own same-trading-day dedup check (see
    # scripts/daily_capture.py::_find_todays_snapshot) means the second
    # trigger of the day is always a harmless no-op skip, not a duplicate.
    - cron: "0 21 * * 1-5"
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {} # manual trigger, used to validate this workflow

jobs:
  capture:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_pass
          POSTGRES_DB: vol_surface_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Once the DATABASE_URL repo secret is set (to Render's *external*
      # Postgres connection string), it's used and this job talks to the
      # real production DB. Until then - and this is what today's manual
      # test run exercises - it falls back to the disposable Postgres
      # service container above, so the workflow is fully self-testable
      # before Render exists. No edit needed here when that secret is added.
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql+psycopg2://ci_user:ci_pass@localhost:5432/vol_surface_ci' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run daily capture
        id: capture
        working-directory: backend
        run: PYTHONPATH=. python3 scripts/daily_capture.py

      - name: Job summary
        if: always()
        run: |
          if [ "${{ steps.capture.outcome }}" = "success" ]; then
            echo "### ✅ Capture succeeded" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ Capture failed" >> "$GITHUB_STEP_SUMMARY"
            echo "See the \"Run daily capture\" step log above for the full traceback." >> "$GITHUB_STEP_SUMMARY"
            echo "GitHub also emails failure notifications for scheduled workflow runs by default (check your notification settings under github.com/settings/notifications if these aren't arriving)." >> "$GITHUB_STEP_SUMMARY"
          fi
